[package]
name = "brew-tui"
version = "0.2.0"
edition = "2021"
authors = ["Cristian Lascu"]
description = "A fast, beautiful terminal UI for managing Homebrew packages and casks"
readme = "README.md"
homepage = "https://github.com/xticriss/brew-tui"
repository = "https://github.com/xticriss/brew-tui"
license = "MIT"
keywords = ["homebrew", "tui", "package-manager", "terminal", "brew"]
categories = ["command-line-utilities"]
description = "A terminal user interface for managing Homebrew packages"
license = "MIT"
authors = ["Cristian Lascu"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = "0.6"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
